name: Bug 报告
description: 报告一个可复现的问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索已有 Issue，避免重复。
  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 发生了什么？预期是什么？
      placeholder: 我期望……但实际……
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 看到……
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 环境信息
      description: 操作系统、运行时版本、相关依赖版本
      placeholder: |
        OS: Windows 11 / macOS 15 / Ubuntu 24.04
        Node: v22.13.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 请粘贴关键报错信息；注意先删除密钥、Cookie、个人邮箱等敏感内容
      render: shell
    validations:
      required: false
